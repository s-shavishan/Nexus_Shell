# Free hosted Windows builds require AppVeyor's public, open-source plan.
# Place this file beside Nexus.Shell.sln in the repository root.
image: Visual Studio 2022

build_script:
  - ps: dotnet run --project .\tests\Nexus.Core.Checks\Nexus.Core.Checks.csproj --configuration Release
  - ps: .\scripts\test-update.ps1
  - ps: .\scripts\build.ps1 -UseMSBuild
  - ps: .\scripts\package.ps1

test: off
deploy: off

artifacts:
  - path: artifacts\Nexus-Shell-1.4.0-win-x64.zip
  - path: artifacts\Nexus-Shell-1.4.0-win-x64.zip.sha256
  - path: artifacts\Nexus-Shell-1.4.0-Update-win-x64.zip
  - path: artifacts\Nexus-Shell-1.4.0-Update-win-x64.zip.sha256
  - path: artifacts\logs\resources-check.json
  - path: artifacts\logs\app-resources.xml
