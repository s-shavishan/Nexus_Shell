# නමෝ බුද්ධාය 🤍
image: Visual Studio 2022

build_script:
  - ps: .\build\build.ps1 -UseMSBuild
  - ps: .\build\package.ps1

test: off
deploy: off

artifacts:
  - path: artifacts\Nexus-Shell-3.6.0-win-x64.zip
  - path: artifacts\Nexus-Shell-3.6.0-win-x64.zip.sha256
  - path: artifacts\Nexus-Shell-3.6.0-Update-win-x64.zip
  - path: artifacts\Nexus-Shell-3.6.0-Update-win-x64.zip.sha256
  - path: artifacts\logs\resources-check.json
  - path: artifacts\logs\app-resources.xml

on_failure:
  - ps: |
      Get-ChildItem artifacts\logs -File -ErrorAction SilentlyContinue |
        ForEach-Object { Push-AppveyorArtifact $_.FullName }
