name: Nexus P2.3 Core and Runtime

on:
  push:
    branches:
      - feat/p23-glass-frame-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p23-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-runtime-windows:
    name: Windows Core + Runtime checks
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Record revision and SDK
        shell: pwsh
        run: |
          Write-Host "GitHub workflow SHA: ${{ github.sha }}"
          git rev-parse HEAD
          dotnet --info
      - name: Core checks
        shell: pwsh
        run: dotnet run --project tests/Nexus.Core.Checks/Nexus.Core.Checks.csproj --configuration Release
      - name: Runtime checks
        shell: pwsh
        run: dotnet run --project tests/Nexus.Runtime.Checks/Nexus.Runtime.Checks.csproj --configuration Release
      - name: Keep diagnostic log on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Core/Runtime check failed for ${{ github.sha }}"
          Write-Host "Native WinUI/AppVeyor packaging checks are separate gates."
