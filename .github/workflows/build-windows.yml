name: Build Nexus for Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Check source structure
        shell: pwsh
        run: python ./scripts/validate-source.py
      - name: Build self-contained x64 app
        shell: pwsh
        run: ./scripts/build.ps1 -UseMSBuild
      - name: Package runnable build
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload runnable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Shell-0.2.0-win-x64
          path: |
            artifacts/Nexus-Shell-0.2.0-win-x64.zip
            artifacts/Nexus-Shell-0.2.0-win-x64.zip.sha256
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-build-logs
          path: artifacts/logs/
          if-no-files-found: ignore
